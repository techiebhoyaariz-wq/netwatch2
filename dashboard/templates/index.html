<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NetWatch — SOC Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
        h1 { color: #58a6ff; margin-bottom: 5px; }
        p.subtitle { color: #8b949e; margin-bottom: 20px; font-size: 13px; }

        /* stat cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .stat-card h3 { font-size: 12px; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .number { font-size: 36px; font-weight: bold; }
        .critical { color: #f85149; }
        .high { color: #e3b341; }
        .medium { color: #58a6ff; }
        .low { color: #3fb950; }

        /* severity badge */
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge.CRITICAL { background: #3d1a1a; color: #f85149; }
        .badge.HIGH { background: #3d2e0a; color: #e3b341; }
        .badge.MEDIUM { background: #0a1f3d; color: #58a6ff; }
        .badge.LOW { background: #0a2218; color: #3fb950; }

        /* main grid */
        .main-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        .card h2 { font-size: 13px; color: #8b949e; margin-bottom: 15px; text-transform: uppercase; }

        /* alerts table */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 8px; color: #8b949e; border-bottom: 1px solid #30363d; }
        td { padding: 8px; border-bottom: 1px solid #21262d; }
        tr:hover { background: #1c2128; }
    </style>
</head>
<body>
    <h1>🛡️ NetWatch</h1>
    <p class="subtitle">Network Security Monitor — real-time packet capture and anomaly detection</p>

    <!-- stat cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Alerts</h3>
            <div class="number" id="totalAlerts">—</div>
        </div>
        <div class="stat-card">
            <h3>Critical</h3>
            <div class="number critical" id="criticalCount">—</div>
        </div>
        <div class="stat-card">
            <h3>High</h3>
            <div class="number high" id="highCount">—</div>
        </div>
        <div class="stat-card">
            <h3>Medium</h3>
            <div class="number medium" id="mediumCount">—</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h2>Protocol Breakdown</h2>
            <canvas id="protocolChart"></canvas>
        </div>
        <div class="card">
            <h2>Recent Alerts</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Source IP</th>
                        <th>Type</th>
                        <th>Severity</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="alertTable">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card">
    <h2>Top Source IPs</h2>
    <table>
        <thead>
            <tr>
                <th>Source IP</th>
                <th>Total Alerts</th>
            </tr>
        </thead>
        <tbody id="topIPsTable">
            <tr><td colspan="2">Loading...</td></tr>
        </tbody>
    </table>
</div>
    </div>

    <script>
        // protocol chart
        const ctx = document.getElementById('protocolChart').getContext('2d');
        const protocolChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: [],
                datasets: [{ data: [], backgroundColor: ['#58a6ff', '#3fb950', '#f85149'] }]
            },
            options: { plugins: { legend: { labels: { color: '#c9d1d9' } } } }
        });

        function updateStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalAlerts').textContent = data.total_alerts;
                    document.getElementById('criticalCount').textContent = data.severity['CRITICAL'] || 0;
                    document.getElementById('highCount').textContent = data.severity['HIGH'] || 0;
                    document.getElementById('mediumCount').textContent = data.severity['MEDIUM'] || 0;
                    protocolChart.data.labels = Object.keys(data.protocols);
                    protocolChart.data.datasets[0].data = Object.values(data.protocols);
                    protocolChart.update();
                });
        }

        function updateAlerts() {
            fetch('/api/alerts')
                .then(r => r.json())
                .then(alerts => {
                    const tbody = document.getElementById('alertTable');
                    if (alerts.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5">No alerts detected</td></tr>';
                        return;
                    }
                    tbody.innerHTML = alerts.map(a =>
                        `<tr>
                            <td>${a.timestamp}</td>
                            <td>${a.source_ip}</td>
                            <td>${a.alert_type}</td>
                            <td><span class="badge ${a.severity}">${a.severity}</span></td>
                            <td>${a.details}</td>
                        </tr>`
                    ).join('');
                });
        }

       function updateTopIPs() {
          fetch('/api/topips')
            .then(r => r.json())
            .then(ips => {
            const tbody = document.getElementById('topIPsTable');
            tbody.innerHTML = ips.map(ip =>
                `<tr>
                    <td>${ip.source_ip}</td>
                    <td>${ip.total}</td>
                </tr>`
            ).join('');
        });
}

updateTopIPs();
setInterval(updateTopIPs, 3000);

        updateStats();
        updateAlerts();
        setInterval(updateStats, 3000);
        setInterval(updateAlerts, 3000);
    </script>
</body>
</html>
